<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Form - The Odin Project</title>

    <!-- norse font -->
    <link href="https://fonts.cdnfonts.com/css/norse" rel="stylesheet" />
    <!-- poppins - google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Poppins", sans-serif;
        /*font-family: 'Norse', sans-serif;*/
        overflow-x: hidden;
      }

      figcaption {
        font-family: "Norse", sans-serif;
      }
      
      /*#left{
          background-image: url('images/leaf.jpg');
      }*/
    </style>

    <!-- tailwind css-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-zinc-200">
    <!-- main start -->
    <main class="mx-auto flex min-h-dvh w-full max-w-7xl justify-center">
      <!-- left start -->
      <div
        id="left"
        class="relative hidden w-2xl bg-[url(/sign-up-form-the-odin-project/images/leaf.jpg)] bg-cover bg-center bg-no-repeat lg:block"
      >
        <figure
          class="absolute top-40 flex w-full items-center justify-center gap-2 bg-black/50 p-2"
        >
          <img src="images/odin-lined.png" alt="odin logo" width="90" />
          <figcaption class="text-8xl font-bold text-zinc-100">ODIN</figcaption>
        </figure>
        <p class="absolute bottom-2 w-full text-center text-xs text-zinc-100">
          Photo by
          <a
            class="underline"
            target="_blank"
            href="https://unsplash.com/id/@haliewestphoto"
            >Halie West</a
          >
          on
          <a
            class="underline"
            target="_blank"
            href="https://unsplash.com/id/foto/tanaman-daun-hijau-dalam-fotografi-close-up-25xggax4bSA"
            >Unsplash</a
          >
        </p>
      </div>
      <!-- left end-->

      <!-- right start -->
      <div class="my-12 w-full">
        <div class="space-y-6 py-16 pr-20 pl-12 text-xl font-medium">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.<br />Sign
            up <i>now</i> to get started.
          </p>
          <p>You <i>know</i> you want to.</p>
        </div>
        <!-- form start -->
        <form action="#">
          <div class="bg-zinc-100 py-6 pr-20 pl-12 shadow-md">
            <h3 class="text-2xl font-medium">Let's do this!</h3>
            <div class="grid grid-cols-1 gap-6 py-8 md:grid-cols-2 md:gap-20">
              <div class="space-y-6">
                <div>
                  <label
                    for="first-name"
                    class="block text-sm font-semibold text-zinc-600 uppercase"
                    >First Name</label
                  >
                  <input
                    type="text"
                    id="first-email"
                    class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500"
                    required
                  />
                </div>
                <div>
                  <label
                    for="email"
                    class="block text-sm font-semibold text-zinc-600 uppercase"
                    >Email</label
                  >
                  <input
                    type="email"
                    id="email"
                    class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500"
                    required
                  />
                </div>
                <div>
                  <label
                    for="password"
                    class="block text-sm font-semibold text-zinc-600 uppercase"
                    >Password</label
                  >
                  <input
                    type="password"
                    id="password"
                    class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500"
                    required
                  />
                </div>
              </div>
              <div class="space-y-6">
                <div>
                  <label
                    for="last-name"
                    class="block text-sm font-semibold text-zinc-600 uppercase"
                    >last name</label
                  >
                  <input
                    type="text"
                    id="last-name"
                    class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500"
                    required
                  />
                </div>
                <div>
                  <label
                    for="phone-number"
                    class="block text-sm font-semibold text-zinc-600 uppercase"
                    >phone number</label
                  >
                  <input
                    type="tel"
                    id="phone-number"
                    class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500"
                    required
                  />
                </div>
                <div>
                  <label
                    for="confirm-password"
                    class="block text-sm font-semibold text-zinc-600 uppercase"
                    >confirm password</label
                  >
                  <input
                    type="password"
                    id="confirm-password"
                    class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500"
                    required
                  />
                </div>
              </div>
            </div>
          </div>
          <div class="space-y-8 py-8 pr-20 pl-12">
            <button
              type="submit"
              class="cursor-pointer rounded-lg bg-[#596D48] px-10 py-3 font-medium text-zinc-100 shadow-lg"
            >
              Create Account
            </button>
            <p>
              Already have an account?
              <a href="#" class="font-semibold text-[#596D48]">Log in</a>
            </p>
          </div>
        </form>
        <!-- form end -->
      </div>
      <!-- right end-->
    </main>
    <!-- main end -->
  </body>
</html>
